<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <!-- Blueprint Canvas -->
  <rect width="1200" height="800" fill="#1A1E22"/>
  
  <!-- Precision Technical Grid -->
  <defs>
    <pattern id="gridFine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#252B31" stroke-width="0.75"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#323A42" stroke-width="1.25"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#gridFine)"/>
  <rect width="1200" height="800" fill="url(#gridMajor)"/>

  <!-- Technical Drawing Border & Title Block -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#48525D" stroke-width="1.5"/>
  <rect x="780" y="650" width="390" height="120" fill="#131619" stroke="#48525D" stroke-width="1.5"/>
  <text x="800" y="675" fill="#E88500" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.1em">PROJECT: NATIONAL HIGHWAYS &amp; VIADUCT WORKS</text>
  <text x="800" y="698" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">GENERAL ARRANGEMENT &amp; ELEVATION</text>
  <text x="800" y="720" fill="#8C96A2" font-family="ui-monospace, monospace" font-size="11">SCALE: 1:200 • CLIENT: STATE ROAD DEVELOPMENT CORP</text>
  <text x="800" y="742" fill="#8C96A2" font-family="ui-monospace, monospace" font-size="11">CONTRACTOR: PAVAKI INFRASOLUTIONS LLP</text>
  <text x="800" y="758" fill="#E88500" font-family="ui-monospace, monospace" font-size="10">DRAWING REF: PI-GA-2026-REV04</text>

  <!-- Datum and Grid Axis Lines -->
  <g stroke="#3D4650" stroke-width="1" stroke-dasharray="8 6">
    <line x1="80" y1="120" x2="1120" y2="120"/>
    <line x1="80" y1="380" x2="1120" y2="380"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
    <line x1="220" y1="60" x2="220" y2="620"/>
    <line x1="480" y1="60" x2="480" y2="620"/>
    <line x1="740" y1="60" x2="740" y2="620"/>
    <line x1="1000" y1="60" x2="1000" y2="620"/>
  </g>

  <!-- Grid Axis Callouts -->
  <g fill="#1A1E22" stroke="#8C96A2" stroke-width="1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">
    <circle cx="220" cy="50" r="14"/><text x="220" y="54" fill="#E88500" stroke="none">A1</text>
    <circle cx="480" cy="50" r="14"/><text x="480" y="54" fill="#E88500" stroke="none">A2</text>
    <circle cx="740" cy="50" r="14"/><text x="740" y="54" fill="#E88500" stroke="none">A3</text>
    <circle cx="1000" cy="50" r="14"/><text x="1000" y="54" fill="#E88500" stroke="none">A4</text>
  </g>

  <!-- Ground Bedrock Profile -->
  <path d="M 60 560 Q 200 550, 350 570 T 700 555 T 1000 565 L 1140 560" stroke="#717C88" stroke-width="2.5" fill="none"/>
  <!-- Hatching for Soil/Rock -->
  <g stroke="#323A42" stroke-width="1">
    <line x1="80" y1="580" x2="120" y2="620"/>
    <line x1="160" y1="580" x2="200" y2="620"/>
    <line x1="240" y1="580" x2="280" y2="620"/>
    <line x1="320" y1="580" x2="360" y2="620"/>
    <line x1="400" y1="580" x2="440" y2="620"/>
    <line x1="480" y1="580" x2="520" y2="620"/>
    <line x1="560" y1="580" x2="600" y2="620"/>
    <line x1="640" y1="580" x2="680" y2="620"/>
  </g>

  <!-- Deep Foundation Bored Piles -->
  <!-- Pier A1 Piles -->
  <g stroke="#616D7A" stroke-width="2" fill="#16191C">
    <rect x="200" y="560" width="16" height="120"/>
    <rect x="224" y="560" width="16" height="120"/>
    <rect x="190" y="530" width="60" height="30" fill="#20252A" stroke="#8C96A2"/>
    
    <!-- Pier A2 Piles -->
    <rect x="460" y="565" width="16" height="120"/>
    <rect x="484" y="565" width="16" height="120"/>
    <rect x="450" y="535" width="60" height="30" fill="#20252A" stroke="#8C96A2"/>

    <!-- Pier A3 Piles -->
    <rect x="720" y="555" width="16" height="120"/>
    <rect x="744" y="555" width="16" height="120"/>
    <rect x="710" y="525" width="60" height="30" fill="#20252A" stroke="#8C96A2"/>
  </g>

  <!-- Reinforced Concrete Bridge Piers & Pier Caps -->
  <g fill="#21272D" stroke="#A8B2BD" stroke-width="2.5">
    <!-- Pier Column A1 -->
    <polygon points="210,530 230,530 226,300 214,300"/>
    <!-- Pier Cap A1 -->
    <polygon points="170,280 270,280 260,300 180,300" fill="#2C343D"/>
    
    <!-- Pier Column A2 (Taller) -->
    <polygon points="470,535 490,535 486,260 474,260"/>
    <!-- Pier Cap A2 -->
    <polygon points="420,240 540,240 530,260 430,260" fill="#2C343D"/>

    <!-- Pier Column A3 -->
    <polygon points="730,525 750,525 746,280 734,280"/>
    <!-- Pier Cap A3 -->
    <polygon points="690,260 790,260 780,280 700,280" fill="#2C343D"/>
  </g>

  <!-- Superstructure Box Girder & Continuous Deck -->
  <g stroke="#E88500" stroke-width="3" fill="#1C2227">
    <path d="M 100 270 L 170 275 L 420 235 L 690 255 L 960 265 L 1120 260 L 1120 245 L 960 250 L 690 240 L 420 220 L 170 260 L 100 255 Z"/>
    <!-- Deck Slab -->
    <line x1="80" y1="240" x2="1140" y2="245" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Crash Barrier / Parapet -->
    <line x1="80" y1="232" x2="1140" y2="237" stroke="#A8B2BD" stroke-width="2"/>
  </g>

  <!-- Stay Cables (Cable-Stayed Bridge Pylon Section at A2) -->
  <g stroke="#E88500" stroke-width="1.5" opacity="0.85">
    <!-- Central Pylon extending up -->
    <polygon points="476,220 484,220 482,100 478,100" fill="#E88500" stroke="none"/>
    <line x1="480" y1="110" x2="280" y2="255"/>
    <line x1="480" y1="130" x2="330" y2="248"/>
    <line x1="480" y1="150" x2="380" y2="240"/>
    <line x1="480" y1="110" x2="680" y2="242"/>
    <line x1="480" y1="130" x2="630" y2="235"/>
    <line x1="480" y1="150" x2="580" y2="228"/>
  </g>

  <!-- Dimension Annotation Lines -->
  <g stroke="#8C96A2" stroke-width="1" font-family="ui-monospace, monospace" font-size="11" fill="#8C96A2">
    <!-- Horizontal Span Dimension A1 to A2 -->
    <line x1="220" y1="190" x2="480" y2="190"/>
    <line x1="220" y1="184" x2="220" y2="196"/>
    <line x1="480" y1="184" x2="480" y2="196"/>
    <text x="350" y="184" text-anchor="middle" fill="#FFFFFF">SPAN L1 = 120,000 MM</text>

    <!-- Horizontal Span Dimension A2 to A3 -->
    <line x1="480" y1="190" x2="740" y2="190"/>
    <line x1="740" y1="184" x2="740" y2="196"/>
    <text x="610" y="184" text-anchor="middle" fill="#FFFFFF">SPAN L2 = 120,000 MM</text>

    <!-- Vertical Clearance Dimension -->
    <line x1="330" y1="248" x2="330" y2="565"/>
    <line x1="324" y1="248" x2="336" y2="248"/>
    <line x1="324" y1="565" x2="336" y2="565"/>
    <text x="340" y="415" fill="#E88500">CLEARANCE: 22.50 M</text>
  </g>

  <!-- Engineering Elevation Badges -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#E88500">
    <text x="90" y="228">▼ DECK LVL +38.500</text>
    <text x="90" y="555">▼ GROUND LVL +16.000</text>
    <text x="90" y="685">▼ PILE TOE LVL +04.000</text>
  </g>
</svg>

