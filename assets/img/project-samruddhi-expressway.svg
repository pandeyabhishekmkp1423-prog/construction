<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Hillside Cut & Highway Terrain -->
  <rect width="800" height="500" fill="#1C2126"/>

  <defs>
    <pattern id="cutGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252A30" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#cutGrid)"/>

  <!-- Engineered Hillside Cut Slope (Benched profile) -->
  <polygon points="40,60 280,60 380,180 500,180 620,320 800,320 800,500 40,500" fill="#171A1D" stroke="#3D454E" stroke-width="2"/>

  <!-- Benched Slope Catchwater Drain & Berms -->
  <line x1="280" y1="60" x2="380" y2="180" stroke="#717D8A" stroke-width="2.5"/>
  <line x1="380" y1="180" x2="500" y2="180" stroke="#E88500" stroke-width="2.5"/>
  <line x1="500" y1="180" x2="620" y2="320" stroke="#717D8A" stroke-width="2.5"/>

  <!-- Slope Rockfall Protection Wire Mesh & Rock Bolting Grid -->
  <g stroke="#E88500" stroke-width="1" stroke-dasharray="4 4" opacity="0.8">
    <line x1="300" y1="84" x2="400" y2="204"/>
    <line x1="320" y1="108" x2="420" y2="228"/>
    <line x1="340" y1="132" x2="440" y2="252"/>
    <line x1="360" y1="156" x2="460" y2="276"/>
    <line x1="520" y1="204" x2="640" y2="344"/>
    <line x1="540" y1="228" x2="660" y2="368"/>
    <line x1="560" y1="252" x2="680" y2="392"/>
  </g>

  <!-- Rock Bolt Anchor Heads (Grout Plates) -->
  <g fill="#E88500">
    <circle cx="310" cy="96" r="3"/>
    <circle cx="330" cy="120" r="3"/>
    <circle cx="350" cy="144" r="3"/>
    <circle cx="530" cy="216" r="3"/>
    <circle cx="550" cy="240" r="3"/>
    <circle cx="570" cy="264" r="3"/>
    <circle cx="590" cy="288" r="3"/>
  </g>

  <!-- Reinforced Concrete Retaining Wall Base -->
  <polygon points="560,420 620,320 640,320 660,420" fill="#2D343E" stroke="#8C96A2" stroke-width="2"/>
  <rect x="540" y="420" width="140" height="30" fill="#20252B" stroke="#6B7280" stroke-width="2"/>

  <!-- Multi-lane Expressway Roadbed Cross Section -->
  <polygon points="40,420 540,420 540,450 40,450" fill="#252C34" stroke="#4B5563" stroke-width="2"/>
  <line x1="40" y1="420" x2="540" y2="420" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Lane markings in roadbed -->
  <line x1="60" y1="420" x2="520" y2="420" stroke="#E88500" stroke-width="1.5" stroke-dasharray="16 16"/>

  <!-- Concrete Crash Barrier (Jersey Barrier) -->
  <polygon points="530,420 534,395 538,390 542,420" fill="#4B5563" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Technical Engineering Title Block Overlay -->
  <rect x="30" y="30" width="370" height="64" fill="#131619" stroke="#374151" stroke-width="1"/>
  <text x="45" y="52" fill="#E88500" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.1em">INFRASTRUCTURE CASE STUDY • MAHARASHTRA</text>
  <text x="45" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Samruddhi Mahamarg Expressway Protection</text>
  <text x="45" y="86" fill="#8C96A2" font-family="ui-monospace, monospace" font-size="9">SCOPE: HIGHWAY CUT-SLOPE STABILISATION &amp; RETAINING WALLS</text>
</svg>

