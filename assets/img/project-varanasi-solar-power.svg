<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Clean Energy & Infrastructure Canvas -->
  <rect width="800" height="500" fill="#1C2126"/>

  <defs>
    <pattern id="solarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252A30" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#solarGrid)"/>

  <!-- Ground Line -->
  <line x1="40" y1="410" x2="760" y2="410" stroke="#48525D" stroke-width="3"/>

  <!-- Solar Array Rack 1 (Foreground) -->
  <g stroke="#E88500" stroke-width="2" fill="#202730">
    <!-- Steel Mounting Stanchions -->
    <line x1="120" y1="410" x2="160" y2="280" stroke="#717D8A" stroke-width="3"/>
    <line x1="280" y1="410" x2="320" y2="280" stroke="#717D8A" stroke-width="3"/>
    <line x1="440" y1="410" x2="480" y2="280" stroke="#717D8A" stroke-width="3"/>
    
    <!-- Tilted Photovoltaic Panel Table -->
    <polygon points="100,340 540,340 500,240 60,240" fill="#243140" stroke="#E88500" stroke-width="2"/>
    <!-- Solar Cells Grid -->
    <line x1="150" y1="240" x2="190" y2="340" stroke="#3D5066" stroke-width="1.5"/>
    <line x1="240" y1="240" x2="280" y2="340" stroke="#3D5066" stroke-width="1.5"/>
    <line x1="330" y1="240" x2="370" y2="340" stroke="#3D5066" stroke-width="1.5"/>
    <line x1="420" y1="240" x2="460" y2="340" stroke="#3D5066" stroke-width="1.5"/>
    <line x1="80" y1="290" x2="520" y2="290" stroke="#3D5066" stroke-width="1.5"/>
  </g>

  <!-- Solar Array Rack 2 (Mid-ground) -->
  <g stroke="#9CA3AF" stroke-width="1.5" fill="#1C242E" opacity="0.8">
    <polygon points="160,220 600,220 570,160 130,160" fill="#1E2834" stroke="#717D8A"/>
    <line x1="180" y1="190" x2="585" y2="190" stroke="#374151"/>
  </g>

  <!-- Inverter Substation & Step-Up Transformer Unit -->
  <g stroke="#8C96A2" stroke-width="2" fill="#242B33">
    <!-- Substation Enclosure -->
    <rect x="600" y="300" width="130" height="110" fill="#262E37"/>
    <line x1="600" y1="330" x2="730" y2="330" stroke="#E88500" stroke-width="2"/>
    <rect x="620" y="345" width="40" height="65" fill="#1A1E24" stroke="#717D8A"/>
    <rect x="670" y="345" width="40" height="65" fill="#1A1E24" stroke="#717D8A"/>
  </g>

  <!-- Power Evacuation Transmission Tower Pylon (Right Side) -->
  <g stroke="#9CA3AF" stroke-width="2" fill="none">
    <line x1="710" y1="410" x2="735" y2="120"/>
    <line x1="770" y1="410" x2="745" y2="120"/>
    <line x1="735" y1="120" x2="745" y2="120"/>
    <!-- Crossarms -->
    <line x1="700" y1="160" x2="780" y2="160" stroke="#E88500" stroke-width="2.5"/>
    <line x1="690" y1="210" x2="790" y2="210" stroke="#E88500" stroke-width="2.5"/>
    <!-- Bracing -->
    <line x1="710" y1="410" x2="760" y2="330"/>
    <line x1="770" y1="410" x2="720" y2="330"/>
    <line x1="720" y1="330" x2="755" y2="250"/>
    <line x1="760" y1="330" x2="725" y2="250"/>
  </g>

  <!-- Technical Engineering Title Block Overlay -->
  <rect x="30" y="30" width="400" height="64" fill="#131619" stroke="#374151" stroke-width="1"/>
  <text x="45" y="52" fill="#E88500" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.1em">RENEWABLE ENERGY INFRASTRUCTURE • VARANASI, UP</text>
  <text x="45" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Grid-Connected Solar Power Project</text>
  <text x="45" y="86" fill="#8C96A2" font-family="ui-monospace, monospace" font-size="9">SCOPE: FOUNDATIONS, MOUNTING STRUCTURES &amp; SUBSTATION CIVIL</text>
</svg>

