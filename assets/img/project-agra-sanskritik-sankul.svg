<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Architectural Elevation Canvas -->
  <rect width="800" height="500" fill="#1C2126"/>

  <defs>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252A30" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#archGrid)"/>

  <!-- Ground Line -->
  <line x1="40" y1="410" x2="760" y2="410" stroke="#48525D" stroke-width="3"/>

  <!-- Main Auditorium Building Massing -->
  <polygon points="120,410 120,200 480,200 480,410" fill="#222830" stroke="#717D8A" stroke-width="2"/>
  
  <!-- Architectural Cantilever Roof Canopy (Saffron Accent) -->
  <polygon points="80,180 540,180 520,200 100,200" fill="#E88500" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="80" y="174" width="460" height="6" fill="#FFA333"/>

  <!-- Exhibition Wing / Secondary Pavilion -->
  <polygon points="480,410 480,260 700,260 700,410" fill="#1B2026" stroke="#5F6975" stroke-width="2"/>
  <rect x="460" y="250" width="260" height="10" fill="#2E3742" stroke="#717D8A"/>

  <!-- Vertical Brise-Soleil / Architectural Louver Facade -->
  <g stroke="#E88500" stroke-width="2">
    <line x1="160" y1="220" x2="160" y2="390"/>
    <line x1="190" y1="220" x2="190" y2="390"/>
    <line x1="220" y1="220" x2="220" y2="390"/>
    <line x1="250" y1="220" x2="250" y2="390"/>
    <line x1="280" y1="220" x2="280" y2="390"/>
    <line x1="310" y1="220" x2="310" y2="390"/>
    <line x1="340" y1="220" x2="340" y2="390"/>
  </g>

  <!-- Glazed Grand Foyer & Entrance Portico -->
  <rect x="380" y="270" width="90" height="140" fill="#29323C" stroke="#8C96A2" stroke-width="2"/>
  <!-- Glazing mullions -->
  <line x1="425" y1="270" x2="425" y2="410" stroke="#8C96A2" stroke-width="1.5"/>
  <line x1="380" y1="340" x2="470" y2="340" stroke="#8C96A2" stroke-width="1.5"/>

  <!-- Entrance Steps and Podium -->
  <rect x="340" y="410" width="170" height="10" fill="#2E3742" stroke="#48525D"/>
  <rect x="320" y="420" width="210" height="10" fill="#222830" stroke="#48525D"/>

  <!-- Exhibition Wing Windows -->
  <rect x="520" y="280" width="140" height="30" fill="#29323C" stroke="#717D8A"/>
  <rect x="520" y="330" width="140" height="30" fill="#29323C" stroke="#717D8A"/>

  <!-- Technical Engineering Title Block Overlay -->
  <rect x="30" y="30" width="410" height="64" fill="#131619" stroke="#374151" stroke-width="1"/>
  <text x="45" y="52" fill="#E88500" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.1em">INSTITUTIONAL BUILDING WORKS • AGRA, UP</text>
  <text x="45" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Shri Atal Bihari Vajpayee Sanskritik Sankul</text>
  <text x="45" y="86" fill="#8C96A2" font-family="ui-monospace, monospace" font-size="9">SCOPE: AUDITORIUMS, EXHIBITION HALLS &amp; COMPLEX CIVIL WORKS</text>
</svg>

