<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Concrete infrastructure pier & cantilever beam abstraction -->
  <!-- Vertical structural column -->
  <rect x="8" y="6" width="9" height="36" fill="currentColor"/>
  <!-- Top horizontal cantilever girder -->
  <rect x="8" y="6" width="32" height="8" fill="currentColor"/>
  <!-- Middle structural diaphragm / portal beam -->
  <rect x="17" y="20" width="23" height="7" fill="currentColor"/>
  <!-- Structural accent wedge / cable anchor (in brand saffron) -->
  <polygon points="31,6 40,6 40,27 31,20" fill="#E88500"/>
  <!-- Foundation footing block -->
  <rect x="4" y="38" width="17" height="4" fill="currentColor"/>
</svg>

