<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Architectural Research Centre Canvas -->
  <rect width="800" height="500" fill="#1C2126"/>

  <defs>
    <pattern id="heritageGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252A30" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#heritageGrid)"/>

  <!-- Ground Line -->
  <line x1="40" y1="410" x2="760" y2="410" stroke="#48525D" stroke-width="3"/>

  <!-- Classical / Heritage Structural Profile with Symmetrical Wings -->
  <!-- Central Pavilion -->
  <polygon points="260,410 260,200 540,200 540,410" fill="#242B33" stroke="#8C96A2" stroke-width="2"/>
  
  <!-- Stepped Heritage Parapet / Chhatri Motif Crown -->
  <polygon points="340,200 460,200 440,160 360,160" fill="#2D3540" stroke="#E88500" stroke-width="2"/>
  <rect x="380" y="130" width="40" height="30" fill="#242B33" stroke="#E88500" stroke-width="2"/>
  <polygon points="370,130 430,130 400,100" fill="#E88500"/>

  <!-- Left Colonade Wing -->
  <polygon points="100,410 100,240 260,240 260,410" fill="#1C2228" stroke="#5F6975" stroke-width="2"/>
  <!-- Right Colonade Wing -->
  <polygon points="540,410 540,240 700,240 700,410" fill="#1C2228" stroke="#5F6975" stroke-width="2"/>

  <!-- Classical Stone Columns / Portico -->
  <g fill="#2D3540" stroke="#A8B2BD" stroke-width="1.5">
    <!-- Col 1 -->
    <rect x="290" y="240" width="20" height="170"/>
    <rect x="284" y="234" width="32" height="6" fill="#E88500"/>
    <!-- Col 2 -->
    <rect x="340" y="240" width="20" height="170"/>
    <rect x="334" y="234" width="32" height="6" fill="#E88500"/>
    <!-- Col 3 -->
    <rect x="440" y="240" width="20" height="170"/>
    <rect x="434" y="234" width="32" height="6" fill="#E88500"/>
    <!-- Col 4 -->
    <rect x="490" y="240" width="20" height="170"/>
    <rect x="484" y="234" width="32" height="6" fill="#E88500"/>
  </g>

  <!-- Central Monumental Entrance Archway -->
  <path d="M 370 410 L 370 290 Q 400 260 430 290 L 430 410 Z" fill="#14181D" stroke="#E88500" stroke-width="2"/>

  <!-- Wing Fenestrations (Jali & Glazing Elements) -->
  <g stroke="#717D8A" stroke-width="1.5" fill="#242B33">
    <rect x="130" y="270" width="40" height="60"/>
    <rect x="190" y="270" width="40" height="60"/>
    <rect x="570" y="270" width="40" height="60"/>
    <rect x="630" y="270" width="40" height="60"/>
  </g>

  <!-- Technical Engineering Title Block Overlay -->
  <rect x="30" y="30" width="390" height="64" fill="#131619" stroke="#374151" stroke-width="1"/>
  <text x="45" y="52" fill="#E88500" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.1em">CULTURAL &amp; RESEARCH INFRASTRUCTURE • AYODHYA</text>
  <text x="45" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Ayodhya Shodh Sansthan Facility</text>
  <text x="45" y="86" fill="#8C96A2" font-family="ui-monospace, monospace" font-size="9">SCOPE: RESEARCH CENTRE CIVIL STRUCTURE &amp; REINFORCED MASONRY</text>
</svg>

